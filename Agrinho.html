<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroGestor Simples</title>
    <link rel="stylesheet" href="Agrinho.css">
</head>
<body>

    <header>
        <h1>🌱 AgroGestor Simples</h1>
        <p>Controle rápido de receita e lucro para produtores rurais</p>
    </header>

    <main>
        <div class="container">

            <label>Cultura:</label>
            <input type="text" id="cultura" placeholder="Ex: Milho">

            <label>Quantidade Produzida:</label>
            <input type="number" id="quantidade" placeholder="Ex: 500">

            <label>Preço por Unidade (R$):</label>
            <input type="number" id="preco" placeholder="Ex: 70">

            <label>Custo de Produção (R$):</label>
            <input type="number" id="custo" placeholder="Ex: 15000">

            <button onclick="calcular()">Calcular</button>

            <div id="resultado"></div>

        </div>
    </main>

    <footer>
        <p>Projeto Agrinho 2026</p>
    </footer>

    <script src="Agrinho.js"></script>
</body>
</html>
